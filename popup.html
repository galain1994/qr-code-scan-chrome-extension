<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>QR Code Scanner</title>
    <style>
        body {
            font: normal 14px/20px helvetica, arial, sans-serif;
            width: 300px;
            padding: 15px;
            margin: 0;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        #wrap > div {
            display: none;
        }

        #wrap > #idle {
            display: block;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }

        button:active {
            background: #2a56c6;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        .info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .warning {
            background: #fff3e0;
            color: #f57c00;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1 id="title"></h1>
    <div id="wrap">
        <div id="idle">
            <button id="scanBtn"></button>
        </div>
        <div id="scanning">
            <div class="loader"></div>
            <div class="status info" id="scanningMessage"></div>
        </div>
        <div id="found">
            <div class="status success" id="foundMessage"></div>
        </div>
        <div id="not-found">
            <div class="status warning" id="notFoundMessage"></div>
            <button id="retryBtn" style="margin-top: 10px;"></button>
        </div>
        <div id="error">
            <div class="status error" id="errorMessage"></div>
            <button id="errorRetryBtn" style="margin-top: 10px;"></button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
